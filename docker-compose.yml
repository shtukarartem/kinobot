services:
  kinobot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      POISKKINO_API_KEY: ${POISKKINO_API_KEY}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS}
      DATABASE_URL: postgresql://kinobot:${POSTGRES_PASSWORD}@postgres:5432/kinobot?schema=public
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    command: sh -c "npm run db:deploy && npm run start"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinobot
      POSTGRES_USER: kinobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - kinobot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kinobot -d kinobot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kinobot_postgres_data:
