services:
  postgres:
    image: postgres:16-alpine
    container_name: kinobot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinobot
      POSTGRES_USER: kinobot
      POSTGRES_PASSWORD: kinobot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinobot -d kinobot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
